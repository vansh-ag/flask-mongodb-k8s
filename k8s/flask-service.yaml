# NodePort Service: makes the Flask app reachable from outside the cluster
# on <minikube-ip>:30080, and load-balances across both Flask Pods.
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: flask-app
  labels:
    app: flask-app
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30080
